services:
  - type: web
    name: collabboards-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/railwayStart.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres (session pooler). Paste the full
      # postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # URL when Render prompts during the Blueprint deploy.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: JWT_REFRESH_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://collabboards-ten.vercel.app
